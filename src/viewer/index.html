<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic AI 학습 화면</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1>학습 화면</h1>
  <label>단원 <select id="unit"></select></label>
  <label>실행 기록 <select id="run"></select></label>
  <span class="spacer"></span>
  <button id="rerun" class="newrun" title="내 코드를 fake LLM 으로 다시 검사해 새 기록을 만듭니다. 이전/다음 버튼과 달리 실제로 다시 실행합니다.">▶ 새로 실행 (내 코드를 다시 검사)</button>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main id="main" aria-live="polite"></main>
<dialog id="doc"><div class="dochead"><b id="doctitle"></b><button id="docclose">닫기 (Esc)</button></div><div id="docbody" class="md"></div></dialog>
<script src="/app.js" type="module"></script>
</body>
</html>
